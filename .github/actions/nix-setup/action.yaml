# Managed by copier — changes may be overwritten by `copier update`
name: Nix Setup
description: Install Nix with Determinate Systems installer

inputs:
  nix-extra-conf:
    description: Additional nix.conf settings
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        extra-conf: |
          eval-cores = 1
          ${{ inputs.nix-extra-conf }}
        diagnostic-endpoint: ""
